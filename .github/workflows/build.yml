name: Build APK

on:
  push:
    branches: [main, lut-camera]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LUTCam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LUTCam-apk
          path: LUTCam.apk

      - name: Publish release (download from phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LUT Cam v1.0.${{ github.run_number }}
          body: Live LUT colour-grading camera. Download LUTCam.apk and install.
          files: LUTCam.apk
