name: Build Teji APK

on:
  push:
    branches: [teji-app]
    paths-ignore: ["build-log.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee build-log.txt
          cp app/build/outputs/apk/debug/app-debug.apk Teji.apk

      - name: Save build log if the build failed
        if: failure()
        run: |
          git config user.name "teji-build"
          git config user.email "teji-build@users.noreply.github.com"
          tail -c 60000 build-log.txt > /tmp/log.txt || echo "no log" > /tmp/log.txt
          cp /tmp/log.txt build-log.txt
          git add -f build-log.txt
          git commit -m "Build log (failed) [skip ci]" || true
          git push origin HEAD:teji-app || true

      - uses: actions/upload-artifact@v4
        with:
          name: Teji-APK
          path: Teji.apk

      - name: Publish APK as release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete teji-latest --yes --cleanup-tag || true
          gh release create teji-latest Teji.apk \
            --target "${{ github.sha }}" \
            --title "Teji Paper Trading APK" \
            --notes "Download Teji.apk on your phone and install it. Live NSE and crypto prices work directly on the phone."

      - name: Keep a copy of the APK on the teji-apk branch
        run: |
          git config user.name "teji-build"
          git config user.email "teji-build@users.noreply.github.com"
          cp Teji.apk /tmp/Teji.apk
          git checkout --orphan teji-apk-tmp
          git rm -rf . -q
          cp /tmp/Teji.apk Teji.apk
          git add Teji.apk
          git commit -m "Teji APK from ${{ github.sha }}"
          git push -f origin HEAD:teji-apk
