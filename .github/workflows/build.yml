name: Build Space Bachao

on:
  push:
    branches: [space-bachao]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build test APK + Play Store bundle
        run: |
          chmod +x gradlew
          ./gradlew assemblePreview bundleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/preview/app-preview.apk SpaceBachao.apk
          cp app/build/outputs/bundle/release/app-release.aab SpaceBachao-unsigned.aab

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceBachao-build
          path: |
            SpaceBachao.apk
            SpaceBachao-unsigned.aab

      - name: Publish release (download from phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: space-bachao-v1.1.${{ github.run_number }}
          name: Space Bachao v1.1.${{ github.run_number }}
          body: Test build. Download SpaceBachao.apk and install. The Play Store version is signed separately.
          files: SpaceBachao.apk

      - name: Save build files to space-bachao-apk branch
        run: |
          mkdir -p /tmp/apkbranch
          cp SpaceBachao.apk SpaceBachao-unsigned.aab /tmp/apkbranch/
          cd /tmp/apkbranch
          git init -q -b space-bachao-apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Space Bachao build (run ${{ github.run_number }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" space-bachao-apk
