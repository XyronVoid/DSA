name: Build Dynamic Island APK

on:
  push:
    branches: [dynamic-island-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk DynamicIsland.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-APK
          path: DynamicIsland.apk

      - name: Publish APK as release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete island-latest --yes --cleanup-tag || true
          gh release create island-latest DynamicIsland.apk \
            --target "${{ github.sha }}" \
            --title "Dynamic Island APK" \
            --notes "Phone pe DynamicIsland.apk download karke install karo."
