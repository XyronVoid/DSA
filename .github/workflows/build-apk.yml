name: Build ReelRok APK

on:
  push:
    branches: [reelrok]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ReelRok.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReelRok-apk
          path: ReelRok.apk

      - name: Publish release (download from phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: reelrok-v1.0.${{ github.run_number }}
          name: ReelRok v1.0.${{ github.run_number }}
          body: Shorts & Reels blocker. ReelRok.apk download karke install karo.
          files: ReelRok.apk
